<!DOCTYPE html> 
<html>
    <head>
        <script src="../js/options.js" type="module"></script>
        <link rel="stylesheet" href="../styles/main.css">
        <link rel="stylesheet" href="../styles/options.css">
        <title> Memory - Opcions </title>
    </head>
    <body>
        <h1 id="title">Opcions</h1>
        
        <div class="grid-options">
            <label for="mode">Mode de joc</label>
            <select id="mode">
                <option value="1" selected>Mode 1</option>
                <option value="2">Mode 2</option>
            </select>

            <div id="opcs-mode1">
                <label for="pairs">Número de cartes</label>
                <input type="number" id="pairs" value="2" min="2" max="6">
                
                <label for="dif">Dificultat</label>
                <select id="dif">
                    <option value="easy">Baixa</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Alta</option>
                </select>

                <label for="groupSize">Mida de grup</label>
                <select id="groupSize">
                    <option value="2" selected>Parelles</option>
                    <option value="3">Trios</option>
                    <option value="4">Quartets</option>
                </select>
            </div>

            <div id="opcs-mode2" style="display:none">
                <label for="dif2">Dificultat inicial Mode 2</label>
                <input type="number" id="dif2" value="1" min="1" max="10">
            </div>
        </div>

        <div class="botons-container">
            <button id="default" class="center">Per defecte</button>
            <button id="apply" class="center">Aplicar</button>
        </div>
    </body>
</html>
